[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-vision"
version = "0.0.5"
description = "Camera zones, masks and detection rules for A.R.M.O.R."
requires-python = ">=3.11"

[project.scripts]
armor-vision = "armor_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
